[project]
name = "election-night"
version = "0.1.0"
description = "Live results and Election-Night Projection for the 2026 Toronto municipal election"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "redis>=8.1.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
election-night = "election_night.cli:main"
