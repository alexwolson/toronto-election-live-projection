name: mock-feed

# Deploys the Mock Feed (#37) by digest: one Fly Machine in ord, outside yyz, serving the City's two
# files for a Rehearsal at https://toronto-election-mock-feed.fly.dev/results. Point the Rehearsal
# pipelines' feed_base_url there. The job fails unless the running image's digest equals the input.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The image tag (its commit), from the image run's summary
        required: true
      digest:
        description: The image digest (sha256:...), from the image run's summary
        required: true
      start:
        description: The Rehearsal's start, ISO 8601 with an offset; it maps to 19:50 EDT Oct 26
        required: true
      speed:
        description: Night minutes per wall minute (about 10 for Plumbing, 1 for the Full night, 4 for the Dress)
        default: "10"
      faults:
        description: Serve the scheduled HTTP faults
        type: choice
        options: ["on", "off"]
        default: "on"

permissions:
  contents: read

concurrency:
  group: deploy-mock-feed

env:
  APP: toronto-election-mock-feed
  TAG: ${{ inputs.tag }}
  DIGEST: ${{ inputs.digest }}
  START: ${{ inputs.start }}
  SPEED: ${{ inputs.speed }}
  FAULTS: ${{ inputs.faults }}

# `bash -eo pipefail`, so a failed CLI call in a pipe fails the step instead of reading as empty.
defaults:
  run:
    shell: bash

jobs:
  fly:
    runs-on: ubuntu-24.04
    env:
      IMAGE: registry.fly.io/toronto-election-night-image:${{ inputs.tag }}@${{ inputs.digest }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag must be the image's full commit sha"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest must be sha256:<64 hex>"; exit 1; }
          [[ "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+([+-][0-9]{2}:[0-9]{2}|Z)$ ]] \
            || { echo "::error::start must be ISO 8601 with an offset"; exit 1; }
          [[ "$SPEED" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::speed must be a number"; exit 1; }
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Create the app if missing
        run: |
          flyctl apps list --json | jq -e --arg app "$APP" 'any(.[]; .Name == $app)' \
            || flyctl apps create "$APP" --org personal
      - name: Deploy by digest
        run: |
          flyctl deploy --config deploy/fly.mockfeed.toml --image "$IMAGE" \
            --env MOCK_FEED_START="$START" --env MOCK_FEED_SPEED="$SPEED" \
            --env MOCK_FEED_FAULTS="$FAULTS" --ha=false --strategy immediate --yes
      - name: Check the deployed digest
        run: |
          flyctl machine list -a "$APP" --json > machines.json
          jq -r '.[] | "\(.id) \(.region) \(.state) \(.config.image) \(.image_ref.digest)"' machines.json
          jq -e --arg d "$DIGEST" 'length == 1 and all(.[];
              .image_ref.digest == $d and .region == "ord"
              and (.config.image | [scan("@sha256:")] | length) <= 1)' machines.json \
            || { echo "::error::Fly is not running exactly one ord Machine on $DIGEST"; exit 1; }
          {
            echo "Mock Feed \`$APP\`: \`$(jq -r '.[0].image_ref.digest' machines.json)\`"
            echo "Feed base URL: https://$APP.fly.dev/results (start $START, speed $SPEED, faults $FAULTS)"
          } >> "$GITHUB_STEP_SUMMARY"
