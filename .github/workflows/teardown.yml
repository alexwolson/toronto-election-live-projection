name: teardown

# Destroys the Rehearsal apps on both providers between Rehearsals (#17 § Rehearsal plan, #32).
# Night apps are left alone until Night Close (night-close.yml), so this job cannot touch them.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rehearsal

# `bash -eo pipefail`, so a failed CLI call in a pipe fails the step instead of reading as empty.
defaults:
  run:
    shell: bash

jobs:
  teardown:
    runs-on: ubuntu-24.04
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Destroy the Rehearsal apps
        run: deploy/shutdown.sh rehearsal >> "$GITHUB_STEP_SUMMARY"
