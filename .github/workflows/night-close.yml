name: night close

# Declares or clears Night Close in the store (#51; docs/store.md § Night Close). Declare it by
# hand once neither file has changed for 2 hours: night status shows the seq pair's age. Closing
# then destroys that environment's two pipeline apps; clearing restarts nothing (the deploy
# workflow recreates them). Run it from the GitHub mobile app. The Upstash console is the
# fallback for the flag.
run-name: "night close: ${{ inputs.action }} (${{ inputs.store }})"

on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store to write, and whose apps to shut down
        type: choice
        options: [night, rehearsal]
        default: night
      action:
        description: "close declares Night Close and shuts down the apps; clear withdraws it"
        type: choice
        options: [close, clear]

permissions:
  contents: read

# `bash -eo pipefail`, so a failed CLI call in a pipe fails the step instead of reading as empty.
defaults:
  run:
    shell: bash

jobs:
  flag:
    runs-on: ubuntu-24.04
    # One write to a store at a time, shared with the switches.
    concurrency:
      group: switch-${{ inputs.store }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - name: Night Close ${{ inputs.action }} (${{ inputs.store }})
        env:
          # Chooses the secret's name, not its value: an empty secret fails the run rather than
          # falling through to the other store.
          REDIS_URL: ${{ secrets[inputs.store == 'night' && 'NIGHT_REDIS_URL' || 'REHEARSAL_REDIS_URL'] }}
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "_Store: ${{ inputs.store }}_"
            echo
            uv run election-night night-close "$ACTION"
            echo
            uv run election-night status
          } >> "$GITHUB_STEP_SUMMARY"

  shutdown:
    # Only after the flag reads back closed: a failed close leaves the pipelines running.
    needs: flag
    if: inputs.action == 'close'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ inputs.store }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Shut down the ${{ inputs.store }} apps
        run: deploy/shutdown.sh "${{ inputs.store }}" >> "$GITHUB_STEP_SUMMARY"
