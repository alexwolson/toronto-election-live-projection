name: night status

# Read-only: prints both heartbeats, the stored seq pair, the switches, Night Close, current
# Withdrawals and count decreases to the job summary (#50, #49, #51), then each Fly app's Machines,
# flagging anything but one started Machine (#111). Run it from the GitHub mobile app.
on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store to read
        type: choice
        options: [night, rehearsal]
        default: night

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Night status (${{ inputs.store }})
        env:
          # Chooses the secret's name, not its value: an empty secret fails the run rather than
          # falling through to the other store.
          REDIS_URL: ${{ inputs.store == 'night' && secrets.NIGHT_REDIS_URL || inputs.store != 'night' && secrets.REHEARSAL_REDIS_URL || '' }}
          # Read-only here: only `flyctl machine list`.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # A Rehearsal also runs the Mock Feed.
          FLY_APPS: ${{ inputs.store == 'night' && 'toronto-election-night-fly' || 'toronto-election-rehearsal-fly toronto-election-mock-feed' }}
        run: |
          apps=()
          for app in $FLY_APPS; do apps+=(--fly-app "$app"); done
          {
            echo "_Store: ${{ inputs.store }}_"
            echo
            uv run election-night status "${apps[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
